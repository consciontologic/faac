name: 🌿 GitFlow
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
concurrency:
  group: gitflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gitflow:
    name: GitFlow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate PR lane or reuse exact-tree promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash xops/ci/step.sh "Validate GitFlow provenance" python3 xops/agent/gitflow.py --check-event
      - name: Job summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '### 🌿 GitFlow\n\nStatus: **%s** · PR source: `%s`\n' "$RESULT" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
