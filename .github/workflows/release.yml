name: 📦 Release packages
run-name: ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain SemVer already committed on current main and verified in an eligible PR
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: faac-release
  cancel-in-progress: false
jobs:
  prepare:
    name: 📦 Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - name: 📥 Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
      - name: 📝 Explain this release run
        run: |
          printf '## 📦 Release preparation\n\nQuality, security and runtime tests are reused from the eligible PR for this exact Git tree. This run builds artifacts and verifies publication integrity.\n\n' >> "$GITHUB_STEP_SUMMARY"
      - name: 🔖 Validate version and current main
        id: release
        env:
          FAAC_RELEASE_VERSION: ${{ inputs.version }}
        run: bash xops/ci/step.sh '🔖 Validate release identity' node xops/package/release.mjs validate
      - name: ♻️ Reuse verified source from the eligible PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash xops/ci/step.sh '♻️ Verify prior PR evidence' python3 xops/agent/release_evidence.py --sha "$GITHUB_SHA" --output build/release-evidence.json
          node xops/package/release.mjs summary-evidence build/release-evidence.json
      - name: 📚 Resolve locked build dependencies without another audit
        run: bash xops/ci/step.sh '📚 Resolve locked dependencies' npm ci --ignore-scripts --no-audit --no-fund
      - name: 📦 Build npm archive, inventory and checksums
        run: bash xops/ci/step.sh '📦 Build versioned npm artifacts' npm run package
      - name: 🐳 Build and seal the container artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash xops/ci/step.sh '🐳 Build versioned container' docker build --tag faac:release --label "org.opencontainers.image.version=$RELEASE_VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          mkdir -p build/container
          docker image inspect --format '{{.Id}}' faac:release > build/container/IMAGE_ID
          bash xops/ci/step.sh '🔐 Seal container archive' docker save --output "build/container/$RELEASE_VERSION.tar" faac:release
          sha256sum "build/container/$RELEASE_VERSION.tar" build/container/IMAGE_ID > build/container/SHA256SUMS
      - name: 📎 Retain package assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: build/package/
          if-no-files-found: error
      - name: 📎 Retain the sealed container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-container
          path: build/container/
          if-no-files-found: error
      - name: 📎 Retain source verification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: build/release-evidence.json
          if-no-files-found: error
      - name: 📝 Preparation result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '\n**Artifact preparation: %s.** No application tests or security scans were repeated.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: 🚀 Publish package and container
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: 📥 Check out the validated publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: 📦 Download this run's package assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: build/package
      - name: 🐳 Download this run's sealed container
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-container
          path: build/container
      - name: ♻️ Recheck main and prior PR evidence before publication
        run: |
          printf '## 🚀 Release publication\n\n' >> "$GITHUB_STEP_SUMMARY"
          bash xops/ci/step.sh '♻️ Recheck source authorization' python3 xops/agent/release_evidence.py --sha "$RELEASE_SHA" --output build/publication-evidence.json
          node xops/package/release.mjs summary-evidence build/publication-evidence.json
      - name: 🔐 Verify artifact transport integrity
        run: |
          (cd build/package && bash ../../xops/ci/step.sh '🔐 Verify npm checksums' sha256sum --check SHA256SUMS)
          bash xops/ci/step.sh '🔐 Verify container checksums' sha256sum --check build/container/SHA256SUMS
      - name: 🔖 Prepare immutable tag and draft release
        run: bash xops/ci/step.sh '🔖 Prepare versioned release' node xops/package/release.mjs publish
      - name: 🪪 Attest package provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: build/package/*
      - name: 🔑 Authenticate GitHub Packages
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 🐳 Publish the sealed container under its semantic version
        id: container
        run: |
          bash xops/ci/step.sh '📦 Load sealed container' docker load --input "build/container/$RELEASE_VERSION.tar"
          expected=$(cat build/container/IMAGE_ID)
          actual=$(docker image inspect --format '{{.Id}}' faac:release)
          if test "$actual" != "$expected"; then
            printf 'Container identity differs from the sealed build artifact.\n' >&2
            exit 1
          fi
          bash xops/ci/step.sh '🐳 Publish versioned container' node xops/package/publish-container.mjs
      - name: 🪪 Attest container provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
      - name: 🎉 Publish the release
        run: |
          bash xops/ci/step.sh '🎉 Make release available' node xops/package/release.mjs finish
          printf "\n### 🎉 Published %s\n\nSource: \`%s\`\n\n📦 \`%s.tgz\` · 📋 \`%s.cdx.json\` · 🔐 \`SHA256SUMS\`\n\n🐳 \`%s:%s\`\n" "$RELEASE_VERSION" "$RELEASE_SHA" "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_IMAGE" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: 📝 Publication result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '\n**Publication: %s.**\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
