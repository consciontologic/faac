name: GitFlow
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Open PR to validate; dispatch its current head branch. Blank is only valid on main/develop.'
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  gitflow:
    name: GitFlow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate branch lane and optional exact PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 xops/agent/gitflow.py --check-event
