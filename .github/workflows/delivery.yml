name: AI delivery
on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [opened, labeled, synchronize, reopened, ready_for_review, closed]
    branches: [main, develop]
  workflow_run:
    workflows: [CI, Container, Security, GitFlow]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional existing issue/PR to authorize; blank reconciles existing work'
        required: false
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read
concurrency:
  group: faac-ai-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'consciontologic/faac'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Privileged workflow: always trusted main. Never checkout a PR head or
      # consume untrusted workflow artifacts, and never npm install or execute it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile bounded AI work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAAC_COPILOT_TOKEN: ${{ secrets.FAAC_COPILOT_TOKEN }}
          FAAC_AUTOMATION_TOKEN: ${{ secrets.FAAC_AUTOMATION_TOKEN }}
        run: python3 xops/agent/delivery.py run
